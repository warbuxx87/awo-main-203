<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0A0706" />
<title>[AWO] Alpha Wolves — Hunt Tracker</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpolygon points=%2210,8 24,22 32,16 40,22 54,8 52,30 40,48 32,58 24,48 12,30%22 fill=%22%23CA883C%22/%3E%3Cpolygon points=%2220,28 27,26 25,32%22 fill=%22%23E8A33D%22/%3E%3Cpolygon points=%2244,28 37,26 39,32%22 fill=%22%23E8A33D%22/%3E%3Cpolygon points=%2232,40 28,45 36,45%22 fill=%22%230A0706%22/%3E%3C/svg%3E' />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AWO" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
  :root{
    --night:#0A0706; --pelt:#17110D; --pelt-2:#211913; --line:#3A2C1E; --line-soft:#281E15;
    --moon:#F2EAD8;        /* bright headline cream */
    --frost:#E7DBC4;       /* primary text          */
    --silver:#A1917A;      /* muted tan-gray        */
    --ice:#CA883C;         /* PRIMARY = brand gold (JS refs this for points/links) */
    --ice-dim:#8A5A24;     /* deep bronze           */
    --ember:#E8A33D;       /* wolf-eye amber accent */
    --chrome:#CFC6B6;      /* logo silver / pace marker */
    --gold-hi:#E8C77A;     /* gold highlight        */
    --hunt:#E0A63E;        /* on pace               */
    --lag:#C77A2E;         /* behind                */
    --idle:#B85A3A;        /* idle                  */
    --r:13px; --r-sm:8px; --gap:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 520px at 50% -10%, rgba(202,136,60,.11), transparent 60%),
      radial-gradient(820px 420px at 88% 4%, rgba(184,90,58,.07), transparent 55%),
      var(--night);
    color:var(--frost);
    font-family:"EB Garamond",Georgia,serif; font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--ice);text-decoration:none}
  ::selection{background:var(--ice);color:var(--night)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}
  .cz{font-family:"Cinzel",serif}
  .tnum{font-feature-settings:"lnum" 1,"tnum" 1}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,rgba(12,9,6,.94),rgba(12,9,6,.86));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(202,136,60,.18);
  }
  .top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px}
  .logo{height:50px;width:auto;display:block;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
  .toolname{font-family:"Cinzel",serif;font-weight:600;letter-spacing:.26em;font-size:11px;
    color:var(--silver);text-transform:uppercase;border-inline-start:1px solid var(--line);padding-inline-start:14px}
  .top-spacer{flex:1}
  .clock{text-align:end;line-height:1.05}
  .clock .lbl{font-family:"Cinzel",serif;letter-spacing:.2em;font-size:9px;color:var(--silver);text-transform:uppercase}
  .clock .val{font-family:"Cinzel",serif;font-weight:700;font-size:16px;color:var(--gold-hi);font-feature-settings:"lnum" 1,"tnum" 1}
  .nextsync{font-family:"Cinzel",serif;letter-spacing:.12em;font-size:10px;color:var(--silver);text-transform:uppercase;white-space:nowrap;align-self:center;font-feature-settings:"lnum" 1,"tnum" 1;opacity:.85}
  .nextsync:empty{display:none}
  .langsel{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.05em;color:var(--frost);background:var(--pelt);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;cursor:pointer;-webkit-appearance:none;appearance:none;align-self:center;max-width:130px}
  .langsel:hover{border-color:var(--ice)}
  .langsel option{background:#17110D;color:var(--frost)}
  .refresh{border:1px solid var(--line);background:var(--pelt);color:var(--frost);
    border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;font-family:"Cinzel",serif;
    letter-spacing:.12em;font-size:11px;text-transform:uppercase;display:flex;gap:8px;align-items:center;
    transition:border-color .15s,background .15s}
  .refresh:hover{border-color:var(--ice);background:var(--pelt-2)}
  .refresh .dot{width:7px;height:7px;border-radius:50%;background:var(--hunt);box-shadow:0 0 6px rgba(224,166,62,.7)}
  .refresh.spin .dot{background:var(--ember);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- mobile header + table polish ---------- */
  @media(max-width:760px){
    thead th,tbody td{white-space:nowrap}
  }
  @media(max-width:560px){
    .top-in{gap:10px;padding:9px 14px}
    .logo{height:40px}
    .toolname{display:none}
    .clock .val{font-size:15px}
    .refresh{padding:7px 11px;font-size:10px}
    table{font-size:14px}
    thead th,tbody td{padding:9px 10px;white-space:nowrap}
    .langsel{font-size:10px;padding:5px 6px;max-width:108px}
  }
  @media(max-width:430px){
    .nextsync{display:none}
  }

  /* ---------- nav ---------- */
  nav.tabs{display:flex;gap:6px;margin:24px 0 20px;flex-wrap:wrap}
  nav.tabs a{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.16em;font-size:12px;
    color:var(--silver);padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;transition:.15s}
  nav.tabs a:hover{color:var(--frost)}
  nav.tabs a.active{color:var(--gold-hi);background:var(--pelt);border-color:var(--line)}

  /* ---------- bottom nav (mobile) ---------- */
  .botnav{display:none}
  @media(max-width:760px){
    nav.tabs{display:none}
    .wrap{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
    .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;justify-content:space-around;
      background:rgba(10,7,6,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
    .botnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 2px;text-decoration:none;color:var(--silver);border-radius:var(--r-sm);
      font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.05em;font-size:9px;
      -webkit-tap-highlight-color:transparent;transition:color .15s}
    .botnav a svg{width:22px;height:22px;display:block}
    .botnav a.active{color:var(--gold-hi)}
    .botnav a:active{background:var(--pelt)}
  }

  /* ---------- panels ---------- */
  .panel{background:linear-gradient(180deg,var(--pelt),#140F0A);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;position:relative}
  .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(202,136,60,.35),transparent);border-radius:var(--r) var(--r) 0 0}
  .panel + .panel{margin-top:var(--gap)}
  .eyebrow{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.24em;font-size:10.5px;color:var(--ice);margin:0 0 4px}
  h2.sec{font-family:"Cinzel",serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:20px;color:var(--gold-hi);margin:0 0 16px}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--gap)}
  @media(max-width:760px){.hero{grid-template-columns:1fr}}
  .goal .big{font-family:"Cinzel",serif;font-weight:800;font-size:clamp(46px,8vw,72px);color:var(--moon);line-height:.95;letter-spacing:-.005em;font-feature-settings:"lnum" 1,"tnum" 1;text-shadow:0 2px 16px rgba(202,136,60,.18)}
  .goal .big .of{color:var(--silver);font-weight:400;font-size:.4em;letter-spacing:.02em}
  .goal .sub{color:var(--silver);font-size:14.5px;margin-top:6px;font-style:italic}
  .verdict{margin-top:16px;font-size:16.5px;color:var(--frost)}
  .verdict b{color:var(--gold-hi);font-weight:600}
  .verdict.behind b{color:var(--ember)}

  /* signature pace bar */
  .bar{position:relative;height:15px;border-radius:8px;background:#0c0805;border:1px solid var(--line);overflow:visible;margin-top:18px}
  .bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ice-dim),var(--ice));transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .bar.good .fill{background:linear-gradient(90deg,var(--ice),var(--gold-hi))}
  .bar .pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--chrome);border-radius:2px;box-shadow:0 0 5px rgba(207,198,182,.6)}
  .bar .pace::after{content:"";position:absolute;top:-4px;left:-3px;border:4px solid transparent;border-top-color:var(--chrome)}
  .pace-key{display:flex;gap:18px;margin-top:12px;font-size:12.5px;color:var(--silver);flex-wrap:wrap}
  .pace-key i{font-style:normal;display:inline-flex;align-items:center;gap:7px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpis.kpis-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){.kpis.kpis-4{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--pelt-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;min-width:0}
  .kpi .k{font-family:"Cinzel",serif;font-weight:700;font-size:25px;color:var(--moon);line-height:1;font-feature-settings:"lnum" 1,"tnum" 1;overflow-wrap:anywhere}
  .kpi .l{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.14em;font-size:9.5px;color:var(--silver);margin-top:8px}
  .kpi.accent .k{color:var(--gold-hi)}

  /* ---------- charts ---------- */
  .chart{width:100%;height:340px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--silver);font-family:"Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;font-size:11px;padding:8px 14px;cursor:pointer}
  .seg button.on{background:var(--pelt-2);color:var(--gold-hi)}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .tbl-wrap::-webkit-scrollbar{height:6px}
  .tbl-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  table{width:100%;border-collapse:collapse;font-size:15.5px}
  thead th{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--silver);
    text-align:end;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  thead th.l{text-align:start}
  thead th .ar{color:var(--ice);font-size:9px}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:end;font-feature-settings:"lnum" 1,"tnum" 1}
  tbody td.l{text-align:start}
  tbody tr:hover{background:#1c150e}
  td.num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
  .rank{color:var(--silver);font-family:"Cinzel",serif;font-feature-settings:"lnum" 1,"tnum" 1}
  .pname{color:var(--frost);font-weight:600;cursor:pointer;font-size:16px}
  .pname:hover{color:var(--gold-hi)}
  tr.clickable{cursor:pointer}

  .badge{display:inline-block;font-family:"Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;padding:4px 9px;border-radius:20px;border:1px solid}
  .b-hunt{color:var(--gold-hi);border-color:#5a431c;background:#211705}
  .b-lag{color:#E2A24E;border-color:#553a1c;background:#211405}
  .b-idle{color:#E08763;border-color:#4d2418;background:#1f0e08}

  .qbar{position:relative;height:8px;width:120px;border-radius:5px;background:#0c0805;border:1px solid var(--line);display:inline-block;vertical-align:middle}
  .qbar .qf{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--ice-dim),var(--ice))}
  .qbar.good .qf{background:linear-gradient(90deg,var(--ice),var(--gold-hi))}
  .qbar.zero .qf{background:var(--idle)}
  .qbar .qp{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--chrome)}

  .wasted{color:var(--ember)}
  .dim{color:var(--silver)}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,3,2,.78);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
  .scrim.open{display:flex}
  .modal{width:min(640px,100%);background:linear-gradient(180deg,var(--pelt),#140F0A);border:1px solid var(--line);border-radius:var(--r);padding:22px;animation:rise .2s ease}
  @keyframes rise{from{transform:translateY(10px);opacity:0}}
  .modal .x{float:right;background:transparent;border:1px solid var(--line);color:var(--silver);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
  .modal h3{font-family:"Cinzel",serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:25px;color:var(--gold-hi);margin:0 0 2px}
  .modal .mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .modal .mrow .kpi .k{font-size:21px}
  .attr{height:280px}

  /* ---------- empty / footer ---------- */
  .empty{text-align:center;padding:44px 18px;color:var(--silver)}
  .empty .ico{margin-bottom:10px;opacity:.6}
  .empty b{color:var(--frost);font-weight:600}
  footer{margin-top:28px;color:var(--silver);font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding-top:16px;font-style:italic}
  footer code{font-family:"EB Garamond",serif;font-style:normal;color:var(--frost);font-size:13px}

  .loading{text-align:center;padding:70px 0;color:var(--silver);font-family:"Cinzel",serif;letter-spacing:.2em;text-transform:uppercase;font-size:13px}
  .err{border-color:#4d2418;background:#1a0f0a}
  .snapbar{background:#211405;border:1px solid #553a1c;color:var(--ember);border-radius:var(--r-sm);
    padding:9px 13px;font-size:13px;margin-bottom:14px;font-style:italic}

  .hidden{display:none !important}
  :focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:4px}
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  .filter-row{display:flex;align-items:center;gap:14px;margin:0 0 16px;flex-wrap:wrap}
  #lbSearch{flex:0 1 260px;background:#0c0805;border:1px solid var(--line);color:var(--frost);
    font-family:"EB Garamond",serif;font-size:15px;padding:9px 13px;border-radius:var(--r-sm)}
  #lbSearch::placeholder{color:var(--silver)}
  #lbSearch:focus{outline:none;border-color:var(--ice);box-shadow:0 0 0 2px rgba(202,136,60,.2)}
  .filter-hint{font-family:"Cinzel",serif;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--silver)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;
    color:var(--silver);background:var(--pelt-2);border:1px solid var(--line);border-radius:20px;
    padding:7px 15px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .pill:hover{color:var(--frost);border-color:var(--ice-dim)}
  .pill.on{color:var(--night);background:linear-gradient(180deg,var(--gold-hi),var(--ice));border-color:var(--ice)}
  .evttoggle{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.1em;font-size:10px;
    color:var(--silver);display:flex;align-items:center;gap:8px;cursor:pointer}
  .evttoggle input{accent-color:var(--ice)}
  .verchip{font-family:"Cinzel",serif;letter-spacing:.1em;font-size:10px;color:var(--silver);
    background:transparent;border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin-inline-start:10px;
    cursor:pointer;transition:color .15s,border-color .15s}
  .verchip:hover{color:var(--gold-hi);border-color:var(--ice-dim)}
  .cl-wrap{max-height:60vh;overflow:auto;margin-top:6px}
  .cl-ver{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;border-top:1px solid var(--line);padding-top:14px}
  .cl-ver:first-child{border-top:0;padding-top:0;margin-top:8px}
  .cl-tag{font-family:"Cinzel",serif;font-weight:700;color:var(--gold-hi);font-size:16px;letter-spacing:.04em}
  .cl-date{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver)}
  .cl-sec{font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--ice);margin:12px 0 4px}
  .cl-list{margin:0 0 6px;padding-left:18px}
  .cl-list li{margin:4px 0;font-size:14.5px;color:var(--frost)}
  .cl-list code{font-family:"EB Garamond",serif;color:var(--gold-hi);font-style:italic}
  .installbtn{border-color:var(--ice-dim);color:var(--gold-hi)}
  #installBtn[hidden]{display:none !important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="wolf" viewBox="0 0 64 64">
  <polygon points="10,8 24,22 32,16 40,22 54,8 52,30 40,48 32,58 24,48 12,30" fill="currentColor"/>
  <polygon points="20,28 27,26 25,32" fill="var(--ember)"/>
  <polygon points="44,28 37,26 39,32" fill="var(--ember)"/>
  <polygon points="32,40 28,45 36,45" fill="#0A0706"/>
</symbol></svg>

/* ============================================================

function gvizUrl(sheetName){
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
         "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) +
         "&_=" + Date.now();
}
async function fetchCsv(sheetName){
  const r = await fetch(gvizUrl(sheetName));
  if(!r.ok) throw new Error(sheetName + " → " + r.status);
  return parseCsv(await r.text());
}

function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c==='\r'){ /* skip */ }
      else cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function num(v){
  if(v==null) return 0;
  const n=parseFloat(String(v).replace(/[\s\u00a0,]/g,""));
  return isNaN(n)?0:n;
}
function lastNonEmpty(row){
  for(let i=row.length-1;i>=0;i--){ const v=(row[i]||"").trim(); if(v!=="") return v; }
  return "";
}
/* tolerant date parse for "2026-06-24 17:00:00" */
function parseDate(s){
  if(!s) return null;
  const m=String(s).trim().match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(!m) return null;
  return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
}

/* summary tab: gviz DROPS the row labels (Start/End/Updated/…) — they show in the
   spreadsheet web view but not in the CSV, so the cells arrive positionally with an
   empty column A. Anchor on content, not labels:
   the datetime-with-time cells are Start, End, Updated (Updated is last); the first
   two positive numbers after Updated are the per-day quota and the point goal. */
function parseSummary(rows){
  // bound the block at the leaderboard header so player rows can't leak in
  let stop=rows.length;
  for(let i=0;i<rows.length;i++){
    if(rows[i].some(c=>(c||"").trim().toUpperCase()==="PLAYER")){ stop=i; break; }
  }
  const reStamp=/\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}/;   // date WITH a time (skips date-only "Today")
  const stamps=[];
  for(let r=0;r<stop;r++){
    for(const c of rows[r]){
      if(c && reStamp.test(String(c).trim())){ stamps.push({r,v:String(c).trim()}); break; }
    }
  }
  // use the LAST three stamps so an added "Today (with time)" row can't shift them
  const at=i=>stamps.length+i>=0?stamps[stamps.length+i]:null;
  const start=at(-3), end=at(-2), updated=at(-1);
  const afterRow=updated?updated.r:-1;
  const nums=[];
  for(let r=afterRow+1;r<stop;r++){
    const n=num(lastNonEmpty(rows[r]));
    if(n>0) nums.push(n);
  }
  return {
    start:   start?parseDate(start.v):null,
    end:     end?parseDate(end.v):null,
    updated: updated?parseDate(updated.v):null,
    perDay:  nums[0] || FALLBACK_PER_DAY,
    goal:    nums[1] || FALLBACK_GOAL
  };
}

/* ChestMatrix → sources[] + players[] (named columns only; padding dropped) */
function parseMatrix(rows){
  if(!rows.length) return {sources:[],players:[]};
  const header=rows[0];
  const cols=[]; // {idx, name}
  for(let i=1;i<header.length;i++){
    const name=(header[i]||"").trim();
    if(name) cols.push({idx:i,name});
  }
  const players=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const name=(row[0]||"").trim();
    if(!name) continue;
    const counts={}; let total=0;
    for(const c of cols){ const v=num(row[c.idx]); counts[c.name]=v; total+=v; }
    players.push({name,counts,total});
  }
  return {sources:cols.map(c=>c.name),players};
}

/* Points → Map(source → weight) */
function parsePoints(rows){
  const m=new Map();
  for(const row of rows){
    const name=(row[0]||"").trim();
    if(!name||name.toUpperCase()==="TURNED ON SOURCE") continue;
    m.set(name,num(row[1]));
  }
  return m;
}

/* ============================================================
   COMPUTE
   ============================================================ */
const DAY=86400000;
let STATE=null;

function compute(summary,matrix,points){
  // live data → real clock; frozen snapshot → its own "updated" time, so pace/projection stay consistent
  const now=(USING_SNAPSHOT && summary.updated)?summary.updated:new Date();
  const total = summary.start&&summary.end ? Math.max((summary.end-summary.start)/DAY,1) : 7;
  const elapsed = summary.start
    ? Math.min(Math.max((now-summary.start)/DAY,0.01), total)
    : 1;
  const daysLeft = Math.max(total-elapsed,0);

  const players=matrix.players.map(p=>{
    let value=0, wastedOpens=0;
    const bySource=[];
    for(const src of matrix.sources){
      const cnt=p.counts[src]||0; if(!cnt) continue;
      const w=points.get(src)||0;
      const pts=cnt*w;
      if(pts>0) bySource.push({src,cnt,w,pts}); else wastedOpens+=cnt;
      value+=pts;
    }
    bySource.sort((a,b)=>b.pts-a.pts);
    const pace = value/elapsed;
    let status="idle";
    if(value>0) status = pace>=summary.perDay ? "hunt" : "lag";
    return {
      name:p.name, value, count:p.total, counts:p.counts,
      eff: p.total? value/p.total : 0,
      pace, status, bySource, wastedOpens
    };
  }).sort((a,b)=>b.value-a.value || b.count-a.count);
  players.forEach((p,i)=>p.rank=i+1);

  // clan distribution by source (counts + points)
  const dist={};
  for(const src of matrix.sources) dist[src]={src,opens:0,w:points.get(src)||0,pts:0};
  for(const p of matrix.players)
    for(const src of matrix.sources){
      const c=p.counts[src]||0; dist[src].opens+=c; dist[src].pts+=c*(points.get(src)||0);
    }
  const sources=Object.values(dist).filter(d=>d.opens>0);

  const clanValue=players.reduce((s,p)=>s+p.value,0);
  const clanChests=players.reduce((s,p)=>s+p.count,0);
  const active=players.filter(p=>p.value>0).length;
  const onQuota=players.filter(p=>p.status==="hunt").length;
  const idle=players.filter(p=>p.value===0).length;
  const clanPts=sources.reduce((s,d)=>s+d.pts,0)||1;

  return {
    summary, now, total, elapsed, daysLeft,
    players, sources,
    clanValue, clanChests, active, onQuota, idle, clanPts,
    goalPct: Math.min(clanValue/summary.goal*100,100),
    goalPacePct: Math.min(elapsed/total*100,100),
    projected: clanValue/elapsed*total
  };
}

for(const l in I18N_OV){ if(I18N[l]) Object.assign(I18N[l],I18N_OV[l]); }
function detectLang(){
  try{ const sv=localStorage.getItem("awo_lang"); if(sv&&SUPPORTED_LANGS.includes(sv)) return sv; }catch(e){}
  const cands=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"en"];
  for(const c of cands){ const base=String(c||"").toLowerCase().split("-")[0]; if(SUPPORTED_LANGS.includes(base)) return base; }
  return "en";
}
let LANG=detectLang();
function t(k){ const d=I18N[LANG]||I18N.en; return (d&&d[k]!=null)?d[k]:(I18N.en[k]!=null?I18N.en[k]:k); }
function tf(k,vars){ let str=t(k); if(vars) for(const p in vars) str=str.split("{"+p+"}").join(String(vars[p])); return str; }
function applyI18n(){
  const r=document.documentElement;
  r.lang=LANG; r.dir=RTL_LANGS.includes(LANG)?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.setAttribute("placeholder",t(el.getAttribute("data-i18n-ph"))); });
  const sel=document.getElementById("langSel"); if(sel) sel.value=LANG;
  if(typeof STATE!=="undefined" && STATE && typeof route==="function") route();
}
function setLang(l){ if(!SUPPORTED_LANGS.includes(l)) return; LANG=l; try{localStorage.setItem("awo_lang",l);}catch(e){} applyI18n(); }

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const kfmt=n=>{n=Math.round(n);if(n>=1000){const k=n/1000;return (Number.isInteger(k)?k:k.toFixed(1))+"k";}return n.toLocaleString("en-US");};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=st=>({hunt:'<span class="badge b-hunt">'+t("status.hunting")+'</span>',
                  lag:'<span class="badge b-lag">'+t("status.lagging")+'</span>',
                  idle:'<span class="badge b-idle">'+t("status.idle")+'</span>'}[st]);

/* mini quota bar: fill = pace/quota, pace notch always at 100% (the quota line) */
function qbar(p,perDay){
  const pct=Math.min(p.pace/perDay*100,100);
  const cls=p.value===0?"zero":(p.status==="hunt"?"good":"");
  return '<span class="qbar '+cls+'"><span class="qf" style="width:'+pct+'%"></span>'
        +'<span class="qp" style="left:100%"></span></span>';
}
function applyLBFilter(){
  const inp=document.getElementById("lbSearch"); if(!inp) return;
  LBQ=inp.value;
  const q=inp.value.trim().toLowerCase();
  const rows=document.querySelectorAll("#lbBody tr");
  let shown=0;
  rows.forEach(tr=>{
    const name=(tr.getAttribute("data-p")||"").toLowerCase();
    const hit=!q||name.includes(q);
    tr.style.display=hit?"":"none";
    if(hit) shown++;
  });
  const nm=document.getElementById("lbNoMatch"); if(nm) nm.style.display=shown?"none":"";
  const hint=document.getElementById("lbHint");
  if(hint) hint.textContent=q?(shown+" of "+rows.length+" shown"):"Tap a hunter for their points breakdown";
}

function viewOverview(s){
  const ahead = s.clanValue >= s.summary.goal*(s.elapsed/s.total);
  const verdict = ahead
    ? tf("ov.verdictAhead",{proj:fmt(s.projected),pct:Math.round(s.projected/s.summary.goal*100)})
    : tf("ov.verdictBehind",{proj:fmt(s.projected),goal:fmt(s.summary.goal)});

  return ''
  +'<div class="panel"><div class="hero">'
    +'<div class="goal">'
      +'<p class="eyebrow">'+t("ov.marchToGoal")+'</p>'
      +'<div class="big" id="goalNum">0<span class="of"> / '+fmt(s.summary.goal)+'</span></div>'
      +'<div class="sub">'+tf("ov.subline",{pct:Math.round(s.goalPct),day:Math.ceil(s.elapsed),total:Math.round(s.total),left:s.daysLeft.toFixed(1)})+'</div>'
      +'<div class="bar '+(ahead?'good':'')+'"><div class="fill" id="goalFill" style="width:0%"></div>'
        +'<div class="pace" style="left:'+s.goalPacePct+'%"></div></div>'
      +'<div class="pace-key">'
        +'<i><span class="swatch" style="background:var(--ice)"></span>'+t("ov.pointsBanked")+'</i>'
        +'<i><span class="swatch" style="background:var(--chrome)"></span>'+t("ov.paceShouldBe")+'</i>'
      +'</div>'
      +'<p class="verdict '+(ahead?'':'behind')+'">'+verdict+'</p>'
    +'</div>'
    +'<div class="kpis" style="grid-template-columns:repeat(2,1fr);align-content:start">'
      +kpi(fmt(s.active),t("ov.kpiScoring"))
      +kpi(fmt(s.onQuota),tf("ov.kpiMeeting",{x:kfmt(s.summary.perDay)}),true)
      +kpi(fmt(s.clanChests),t("ov.kpiChests"))
      +kpi(fmt(s.idle),t("ov.kpiIdle"))
    +'</div>'
  +'</div></div>'

  +'<div class="panel">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'
      +'<div><p class="eyebrow">'+t("ov.sourceBreakdown")+'</p><h2 class="sec" style="margin:0">'+t("ov.whereFrom")+'</h2></div>'
      +'<div class="seg" id="distSeg"><button class="on" data-m="pts">'+t("ov.byPoints")+'</button><button data-m="opens">'+t("ov.byOpens")+'</button></div>'
    +'</div>'
    +'<div id="distChart" class="chart"></div>'
    +'<p class="dim" style="font-size:12.5px;margin:4px 2px 0">'+t("ov.sourceNote")+'</p>'
  +'</div>'

  +'<div class="panel"><p class="eyebrow">'+t("ov.frontOfPack")+'</p><h2 class="sec">'+t("ov.topHunters")+'</h2>'
    +topList(s)+'</div>';
}
function kpi(v,l,accent){return '<div class="kpi'+(accent?' accent':'')+'"><div class="k">'+v+'</div><div class="l">'+l+'</div></div>';}
function topList(s){
  const top=s.players.slice(0,5);
  let h='<div class="tbl-wrap"><table><tbody>';
  for(const p of top){
    h+='<tr class="clickable" data-p="'+esc(p.name)+'">'
      +'<td class="l rank" style="width:34px">#'+p.rank+'</td>'
      +'<td class="l"><span class="pname">'+esc(p.name)+'</span></td>'
      +'<td class="num" style="color:var(--moon);font-weight:700">'+fmt(p.value)+'</td>'
      +'<td class="l" style="width:140px">'+qbar(p,s.summary.perDay)+'</td>'
      +'<td>'+badge(p.status)+'</td></tr>';
  }
  return h+'</tbody></table></div>';
}

function viewLeaderboard(s){

  ];
  const arr=[...s.players].sort((a,b)=>{
    let x=a[SORT.key],y=b[SORT.key];
    if(SORT.key==="status"){const o={hunt:3,lag:2,idle:1};x=o[a.status];y=o[b.status];}
    if(SORT.key==="name")return SORT.dir*String(a.name).localeCompare(b.name);
    return SORT.dir*((x||0)-(y||0));
  });
  let h='<div class="panel"><p class="eyebrow">'+s.players.length+' hunters · '+s.onQuota+' on pace · '+s.idle+' idle</p>'
    +'<h2 class="sec">Leaderboard</h2>'
    +'<div class="filter-row">'
      +'<input id="lbSearch" type="text" placeholder="Search hunter…" value="'+esc(LBQ)+'" autocomplete="off" spellcheck="false" />'
      +'<span class="filter-hint" id="lbHint"></span>'
    +'</div>'
    +'<div class="tbl-wrap"><table><thead><tr>';
  for(const c of cols){
    const ar = SORT.key===c.k ? '<span class="ar">'+(SORT.dir<0?'▼':'▲')+'</span>' : '';
    h+='<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'">'+c.t+' '+ar+'</th>';
  }
  h+='</tr></thead><tbody id="lbBody">';
  for(const p of arr){
    h+='<tr class="clickable" data-p="'+esc(p.name)+'">'
      +'<td class="l rank">'+p.rank+'</td>'
      +'<td class="l" dir="auto"><span class="pname">'+esc(p.name)+'</span></td>'
      +'<td class="num" style="color:var(--moon);font-weight:600">'+fmt(p.value)+'</td>'
      +'<td class="num">'+fmt(p.count)+'</td>'
      +'<td class="num dim">'+(p.eff?p.eff.toFixed(1):'—')+'</td>'
      +'<td class="num">'+fmt(p.pace)+'</td>'
      +'<td class="l">'+qbar(p,s.summary.perDay)+'</td>'
      +'<td class="l">'+badge(p.status)+'</td></tr>';
  }
  return h+'</tbody></table></div>'
    +'<div id="lbNoMatch" class="empty" style="display:none">No hunter by that name.</div>'
    +'<p class="dim" style="font-size:12.5px;margin-top:12px">Pace = points ÷ days elapsed. The amber line marks the '+fmt(s.summary.perDay)+'-pts/day quota; bars that reach it are on track.</p></div>';
}

let CHSORT={key:"pts",dir:-1};
function viewChests(s){
  const arr=[...s.sources].sort((a,b)=>CHSORT.dir*((a[CHSORT.key]||0)-(b[CHSORT.key]||0)));
  const cols=[{k:"src",t:"Source",l:true},{k:"opens",t:"Opens"},{k:"w",t:"Pts each"},{k:"pts",t:"Total points"},{k:"share",t:"% of score"}];
  let h='<div class="panel"><p class="eyebrow">'+s.sources.length+' active sources</p><h2 class="sec">What actually scores</h2>'
    +'<div class="tbl-wrap"><table><thead><tr>';
  for(const c of cols){
    const ar=CHSORT.key===c.k?'<span class="ar">'+(CHSORT.dir<0?'▼':'▲')+'</span>':'';
    h+='<th class="'+(c.l?'l':'')+'" data-ck="'+c.k+'">'+c.t+' '+ar+'</th>';
  }
  h+='</tr></thead><tbody>';
  for(const d of arr){
    const share=d.pts/s.clanPts*100;
    const dead=d.w===0;
    h+='<tr>'
      +'<td class="l" '+(dead?'style="color:var(--ember)"':'')+'>'+esc(d.src)+(dead?' <span class="dim" style="font-size:11px">· no points</span>':'')+'</td>'
      +'<td class="num">'+fmt(d.opens)+'</td>'
      +'<td class="num dim">'+(d.w?fmt(d.w):'0')+'</td>'
      +'<td class="num" style="color:'+(dead?'var(--silver)':'var(--moon)')+';font-weight:600">'+fmt(d.pts)+'</td>'
      +'<td class="num">'+(share>=0.05?share.toFixed(1)+'%':'—')+'</td></tr>';

    +'<p class="dim" style="font-size:12.5px;margin-top:12px"><span class="wasted">'+fmt(wasted)+' chests</span> were opened on sources worth zero points this event — effort that didn\'t move the score.</p></div>';

let EVTSEL = EVENT_GROUPS.length ? EVENT_GROUPS[0].id : null;
let EVTZEROS = false;

function viewEvents(s){
  if(!EVENT_GROUPS.length)
    return '<div class="panel"><div class="empty">No event groups configured.</div></div>';
  const grp = EVENT_GROUPS.find(g=>g.id===EVTSEL) || EVENT_GROUPS[0];
  const inGroup = src => grp.match.some(m=>src.toLowerCase().includes(m.toLowerCase()));
  const groupSources = s.sources.filter(d=>inGroup(d.src));
  const clanOpens = groupSources.reduce((x,d)=>x+d.opens,0);
  const ranked = s.players.map(p=>{
    let opens=0;
    for(const d of groupSources) opens += (p.counts && p.counts[d.src]) || 0;
    return { name:p.name, opens };
  }).sort((a,b)=>b.opens-a.opens);
  const participants = ranked.filter(p=>p.opens>0);
  const top = participants[0];
  const pills = EVENT_GROUPS.map(g=>
    '<button class="pill'+(g.id===grp.id?' on':'')+'" data-evt="'+g.id+'">'+esc(g.label)+'</button>').join('');
  let h='<div class="panel"><p class="eyebrow">Event participation</p>'
    +'<div class="pills">'+pills+'</div>';
  if(!groupSources.length)
    return h+'<div class="empty" style="margin-top:10px">No chests from <b>'+esc(grp.label)+'</b> have been opened yet.</div></div>';
  h+='<div class="kpis kpis-4" style="margin-top:18px">'
    +kpi(fmt(clanOpens),"Chests opened")
    +kpi(fmt(participants.length)+' / '+fmt(s.players.length),"Participated",true)
    +kpi(fmt(s.players.length-participants.length),"Sat out")
    +kpi(top?esc(top.name):'—',"Top opener")
   +'</div>';
  if(groupSources.length>1){
    const srcRows=[...groupSources].sort((a,b)=>b.opens-a.opens).map(d=>
      '<tr><td class="l">'+esc(d.src)+'</td><td class="num">'+fmt(d.opens)+'</td></tr>').join('');
    h+='<p class="eyebrow" style="margin-top:22px">Sources in this event</p>'
      +'<div class="tbl-wrap"><table><tbody>'+srcRows+'</tbody></table></div>';
  }
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px">'
    +'<h2 class="sec" style="margin:0">'+esc(grp.label)+' leaderboard</h2>'
    +'<label class="evttoggle"><input type="checkbox" id="evtZeros"'+(EVTZEROS?' checked':'')+' /> show hunters who sat out</label>'
   +'</div>';
  const list = EVTZEROS ? ranked : participants;
  const maxOpens = participants.length ? participants[0].opens : 1;
  let rows='';
  list.forEach((p,i)=>{
    const pct = clanOpens ? p.opens/clanOpens*100 : 0;
    const barpct = maxOpens ? p.opens/maxOpens*100 : 0;
    rows+='<tr class="clickable" data-p="'+esc(p.name)+'">'
      +'<td class="l rank">'+(i+1)+'</td>'
      +'<td class="l" dir="auto"><span class="pname">'+esc(p.name)+'</span></td>'
      +'<td class="num" style="color:var(--moon);font-weight:600">'+fmt(p.opens)+'</td>'
      +'<td class="l" style="width:130px"><span class="qbar"><span class="qf" style="width:'+barpct+'%"></span></span></td>'
      +'<td class="num dim">'+(pct>=0.05?pct.toFixed(1)+'%':'—')+'</td>'
      +'<td class="l">'+(p.opens>0?'<span class="badge b-hunt">In</span>':'<span class="badge b-idle">Out</span>')+'</td></tr>';
  });
  h+='<div class="tbl-wrap"><table><thead><tr>'
    +'<th class="l">#</th><th class="l">Hunter</th><th>Opens</th><th class="l">Relative</th><th>% of event</th><th class="l">Status</th>'
    +'</tr></thead><tbody id="evtBody">'+rows+'</tbody></table></div>';
  return h+'</div>';
}

const ROUTES={overview:viewOverview,leaderboard:viewLeaderboard,events:viewEvents,chests:viewChests,history:viewHistory};
function route(){
  if(!STATE) return;
  const hash=(location.hash.replace("#","")||"overview");

  $("#app").innerHTML=view(STATE);
  document.querySelectorAll("#nav a, #botNav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+hash));

function wire(hash){
  // player click
  document.querySelectorAll("[data-p]").forEach(el=>el.addEventListener("click",()=>openPlayer(el.getAttribute("data-p"))));
  if(hash==="leaderboard"){
    document.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{
      const k=th.getAttribute("data-k");
      SORT = SORT.key===k ? {key:k,dir:-SORT.dir} : {key:k,dir:(k==="name"?1:-1)};
      route();
    }));
    const lb=document.getElementById("lbSearch");
    if(lb){ lb.addEventListener("input",applyLBFilter); applyLBFilter(); }
  }
  if(hash==="events"){
    document.querySelectorAll(".pill[data-evt]").forEach(b=>b.addEventListener("click",()=>{
      EVTSEL=b.getAttribute("data-evt"); route();
    }));
    const z=document.getElementById("evtZeros");
    if(z) z.addEventListener("change",()=>{ EVTZEROS=z.checked; route(); });
  }
  if(hash==="chests")
    document.querySelectorAll("th[data-ck]").forEach(th=>th.addEventListener("click",()=>{
      const k=th.getAttribute("data-ck");
      CHSORT = CHSORT.key===k ? {key:k,dir:-CHSORT.dir} : {key:k,dir:(k==="src"?1:-1)};
      route();
    }));
  if(hash==="overview")
    document.querySelectorAll("#distSeg button").forEach(b=>b.addEventListener("click",()=>{
      distMode=b.getAttribute("data-m");
      document.querySelectorAll("#distSeg button").forEach(x=>x.classList.toggle("on",x===b));
      renderDist(STATE);
    }));
}
function animateGoal(s){
  const numEl=$("#goalNum"), fill=$("#goalFill"); if(!numEl) return;
  const target=s.clanValue, dur=900, t0=performance.now();
  const goalLabel=' <span class="of"> / '+fmt(s.summary.goal)+'</span>';
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){
    numEl.innerHTML=fmt(target)+goalLabel; fill.style.width=s.goalPct+"%"; return;
  }
  requestAnimationFrame(function step(t){
    const k=Math.min((t-t0)/dur,1), e=1-Math.pow(1-k,3);
    numEl.innerHTML=fmt(target*e)+goalLabel;
    if(k<1) requestAnimationFrame(step); else numEl.innerHTML=fmt(target)+goalLabel;
  });
  fill.style.width=s.goalPct+"%";
}

/* ============================================================
   COUNTDOWN
   ============================================================ */
function tickClock(){
  const el=$("#countdown");
  if(el && STATE && STATE.summary.end){
    let d=STATE.summary.end-new Date();
    if(d<=0){ el.textContent="ENDED"; }
    else{
      const days=Math.floor(d/DAY); d-=days*DAY;
      const h=Math.floor(d/3.6e6); d-=h*3.6e6;
      const m=Math.floor(d/6e4);
      el.textContent=(days?days+"d ":"")+String(h).padStart(2,"0")+"h "+String(m).padStart(2,"0")+"m";
    }
  }
  // countdown to the next data refresh (synced to the ~2h scrape cadence)
  const ns=$("#nextSync");
  if(ns){
    if(!nextRefreshAt){ ns.textContent=""; }
    else{
      let left=Math.round((nextRefreshAt-Date.now())/1000);
      if(left<=0){ ns.textContent=t("hdr.syncing"); }
      else{
        const h=Math.floor(left/3600); left-=h*3600;
        const m=Math.floor(left/60); const s=left-m*60;
        const p=n=>String(n).padStart(2,"0");
        ns.textContent=t("hdr.nextSync")+" "+(h?h+":"+p(m)+":"+p(s):m+":"+p(s));
      }
    }
  }
}
setInterval(tickClock,1000);

/* ============================================================
   LOAD
   ============================================================ */
async function load(){
  const btn=$("#refreshBtn"); btn&&btn.classList.add("spin");
  try{
    let sum,mat,pts;
    try{
      [mat,pts]=await Promise.all([fetchCsv(TABS.matrix),fetchCsv(TABS.points)]);
      sum=await fetchCsv(TABS.summary).catch(()=>parseCsv(SNAPSHOT.summaryCsv));
      USING_SNAPSHOT=false;
    }catch(netErr){
      mat=parseCsv(SNAPSHOT.matrixCsv);
      pts=parseCsv(SNAPSHOT.pointsCsv);
      sum=parseCsv(SNAPSHOT.summaryCsv);
      USING_SNAPSHOT=true;
    }
    STATE=compute(parseSummary(sum),parseMatrix(mat),parsePoints(pts));
    $("#boot").classList.add("hidden");
    $("#app").classList.remove("hidden");
    renderBanner();
    route(); tickClock();
    const key = STATE.summary.updated ? STATE.summary.updated.getTime() : null;
    const fresh = key!==null && lastUpdatedKey!==null && key!==lastUpdatedKey;
    lastUpdatedKey = key;
    scheduleRefresh(fresh);
  }catch(err){
    $("#boot").classList.remove("hidden"); $("#boot").classList.add("err");
    $("#boot").innerHTML='<div class="panel err" style="text-align:left">'
      +'<h2 class="sec" style="color:var(--idle)">Couldn\'t load the data</h2>'
      +'<p class="dim">'+esc(err.message)+'</p></div>';
    scheduleRefresh(false);
  }finally{ btn&&btn.classList.remove("spin"); }
}
function scheduleRefresh(fresh){
  clearTimeout(refreshTimer);
  // fresh scrape just landed → next one ~2h out; otherwise re-check soon (late scrape / first load)
  const delay = Math.max(fresh ? (SCRAPE_INTERVAL + POST_SCRAPE_BUFFER) : RETRY_MS, 60*1000);
  nextRefreshAt = Date.now() + delay;
  refreshTimer = setTimeout(load, delay);
}
